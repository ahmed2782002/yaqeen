name: yaqeen
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.2
  google_fonts: ^6.1.0
  provider: ^6.0.5
  localization: ^2.1.1
  audioplayers: ^5.2.1
  shared_preferences: ^2.2.2
  scrollable_positioned_list: ^0.2.3
  flutter_native_splash: ^2.2.15
  url_launcher: ^6.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/files/
    - assets/
  fonts:
    - family: quran
      fonts:
        - asset: assets/HafsSmart_08.ttf
    - family: me_quran
      fonts:
        - asset: assets/me_quran.ttf

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/hadeth_header.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/images/hadeth_header.png"
    background_color: "#ffffff"
    theme_color: "#000000"
  windows:
    generate: true
    image_path: "assets/images/hadeth_header.png"
    icon_size: 80
  macos:
    generate: true
    image_path: "assets/images/hadeth_header.png"
